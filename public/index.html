<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>親情防斷線 V0.1</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;margin:0;background:#f5f5f5;color:#222}
.wrap{max-width:720px;margin:auto;padding:20px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
h1{font-size:24px;margin:0 0 6px}.muted{color:#777;font-size:14px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e9f7ec;margin-bottom:8px}
.yellow{background:#fff4d6}.green{background:#e9f7ec}
.msg{padding:10px 12px;border-radius:14px;margin:7px 0;max-width:85%}
.user{background:#e8f1ff;margin-left:auto}.ai{background:#f1f1f1}
button{border:0;border-radius:12px;padding:10px 14px;font-size:15px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:12px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>❤️ 親情防斷線 V0.1</h1>
  <div class="muted">子女端測試畫面｜真正爸媽端仍走 LINE</div>

  <div class="card">
    <div class="badge" id="status">等待測試</div>
    <p>輸入爸媽的 LINE User ID 後，可查看目前測試對話與「親情雷達」。</p>
    <input id="uid" placeholder="LINE User ID">
    <button onclick="loadData()">查看</button>
  </div>

  <div class="card">
    <h2>親情雷達</h2>
    <div id="radar">尚無資料</div>
  </div>

  <div class="card">
    <h2>最近對話</h2>
    <div id="chat">尚無資料</div>
  </div>
</div>
<script>
async function loadData(){
  const uid=document.getElementById('uid').value.trim();
  if(!uid)return;
  const r=await fetch('/api/family/'+encodeURIComponent(uid));
  const d=await r.json();
  document.getElementById('status').textContent='已載入';
  document.getElementById('radar').innerHTML=d.radar.map(x=>
    `<div class="card ${x.level}"><b>${x.title}</b><br>${x.detail}</div>`
  ).join('');
  document.getElementById('chat').innerHTML=d.recentMessages.map(x=>
    `<div class="msg ${x.role==='user'?'user':'ai'}">${escapeHtml(x.text)}</div>`
  ).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
</script>
</body>
</html>
